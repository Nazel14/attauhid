<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#F6F7F2">
    <title>Tidak Ada Koneksi</title>

    <!-- Halaman ini disajikan service worker saat server tidak terjangkau,
         jadi semuanya harus ada di file ini sendiri: tanpa CSS/JS/font luar,
         tanpa gambar. Gaya disamakan dengan resources/views/errors/layout. -->
    <script>
        // Ikut tema aplikasi bila pengguna pernah memilih; selain itu ikut
        // pengaturan perangkat (lihat @media di bawah).
        try {
            var t = localStorage.getItem('theme');
            if (t === 'dark') document.documentElement.classList.add('dark');
            if (t === 'light') document.documentElement.classList.add('light');
        } catch (e) {}
    </script>

    <style>
        :root {
            --latar: #F6F7F2; --kartu: #FFFFFF; --garis: #E1E4D8;
            --teks: #1B1D19; --redup: #6B7066; --samar: #9CA196;
            --aksen: #649634; --aksen-hover: #4D752A;
            --ikon-latar: #E6F2D5; --ikon: #4D752A;
            --bayang: 0 1px 2px rgba(27,29,25,.04), 0 24px 48px -12px rgba(61,92,36,.14);
            --gelembung-a: rgba(126,184,66,.20); --gelembung-b: rgba(176,215,130,.25);
        }
        html.dark {
            --latar: #1B1D19; --kartu: #24271F; --garis: #3A3F35;
            --teks: #F6F7F2; --redup: #A3A89C; --samar: #6F7569;
            --aksen: #7EB842; --aksen-hover: #96C85D;
            --ikon-latar: rgba(126,184,66,.16); --ikon: #B0D782;
            --bayang: 0 1px 2px rgba(0,0,0,.3), 0 24px 48px -12px rgba(0,0,0,.5);
            --gelembung-a: rgba(126,184,66,.12); --gelembung-b: rgba(100,150,52,.10);
        }
        @media (prefers-color-scheme: dark) {
            html:not(.light) {
                --latar: #1B1D19; --kartu: #24271F; --garis: #3A3F35;
                --teks: #F6F7F2; --redup: #A3A89C; --samar: #6F7569;
                --aksen: #7EB842; --aksen-hover: #96C85D;
                --ikon-latar: rgba(126,184,66,.16); --ikon: #B0D782;
                --bayang: 0 1px 2px rgba(0,0,0,.3), 0 24px 48px -12px rgba(0,0,0,.5);
                --gelembung-a: rgba(126,184,66,.12); --gelembung-b: rgba(100,150,52,.10);
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh; min-height: 100dvh;
            display: grid; place-items: center; padding: 24px;
            color: var(--teks);
            background:
                radial-gradient(42rem 42rem at 12% -10%, var(--gelembung-a), transparent 60%),
                radial-gradient(36rem 36rem at 110% 110%, var(--gelembung-b), transparent 60%),
                var(--latar);
            font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .kartu {
            position: relative; overflow: hidden;
            width: 100%; max-width: 420px; text-align: center;
            background: var(--kartu); border: 1px solid var(--garis);
            border-radius: 28px; padding: 40px 32px 30px;
            box-shadow: var(--bayang);
        }
        .kartu::before {
            content: ""; position: absolute; inset: 0 0 auto 0; height: 4px;
            background: linear-gradient(90deg, #96C85D, #649634);
        }

        .ikon {
            margin: 0 auto; width: 76px; height: 76px; border-radius: 24px;
            display: grid; place-items: center;
            background: var(--ikon-latar); color: var(--ikon);
            box-shadow: 0 0 0 8px rgba(126,184,66,.10);
        }
        .ikon svg { width: 36px; height: 36px; }

        .status {
            display: inline-flex; align-items: center; gap: 7px;
            margin-top: 24px; padding: 5px 12px; border-radius: 999px;
            font-size: 12px; font-weight: 700; letter-spacing: .04em;
            background: #FEF2F2; color: #B91C1C;
        }
        html.dark .status { background: rgba(239,68,68,.14); color: #FCA5A5; }
        .status .titik { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
        .status.mencoba .titik { animation: denyut 1s ease-in-out infinite; }
        .status.ok { background: #E6F2D5; color: #3D5C24; }
        html.dark .status.ok { background: rgba(126,184,66,.16); color: #B0D782; }

        /* Varian gelap juga untuk mode gelap bawaan perangkat. */
        @media (prefers-color-scheme: dark) {
            html:not(.light) .status { background: rgba(239,68,68,.14); color: #FCA5A5; }
            html:not(.light) .status.ok { background: rgba(126,184,66,.16); color: #B0D782; }
        }

        h1 { margin-top: 12px; font-size: 24px; font-weight: 800; letter-spacing: -.02em; line-height: 1.2; }
        p.pesan { margin: 10px auto 0; max-width: 320px; font-size: 15px; line-height: 1.65; color: var(--redup); }

        .tips {
            margin: 22px auto 0; max-width: 320px; text-align: left;
            list-style: none; display: grid; gap: 8px;
        }
        .tips li { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; line-height: 1.5; color: var(--redup); }
        .tips svg { flex: none; width: 18px; height: 18px; margin-top: 1px; color: var(--aksen); }

        .tombol {
            margin-top: 26px; width: 100%;
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 13px 20px; border-radius: 14px; border: 0; cursor: pointer;
            background: var(--aksen); color: #fff;
            font: inherit; font-size: 14.5px; font-weight: 700; line-height: 1.2;
            box-shadow: 0 8px 20px -8px rgba(100,150,52,.7);
            transition: background .15s, transform .1s;
        }
        .tombol:hover { background: var(--aksen-hover); }
        .tombol:active { transform: scale(.98); }
        .tombol:focus-visible { outline: 3px solid rgba(126,184,66,.45); outline-offset: 2px; }
        .tombol svg { width: 18px; height: 18px; }
        .tombol.memuat svg { animation: putar .8s linear infinite; }

        .catatan { margin-top: 14px; font-size: 12.5px; color: var(--samar); }

        @keyframes putar { to { transform: rotate(360deg); } }
        @keyframes denyut { 50% { opacity: .35; } }
        @media (max-width: 420px) {
            body { padding: 16px; }
            .kartu { padding: 34px 20px 24px; border-radius: 24px; }
            h1 { font-size: 22px; }
        }
        @media (prefers-reduced-motion: reduce) {
            .tombol.memuat svg, .status.mencoba .titik { animation: none; }
        }
    </style>
</head>
<body>
    <main class="kartu" role="main">
        <div class="ikon" aria-hidden="true">
            <!-- Wi-Fi dicoret -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 3l18 18"/>
                <path d="M8.5 16.4a5 5 0 017 0"/>
                <path d="M5 12.9a10 10 0 015.2-2.8m3.6 0A10 10 0 0119 12.9"/>
                <path d="M1.5 9.3a15 15 0 014.4-2.9m4-1A15 15 0 0122.5 9.3"/>
                <path d="M12 20h.01"/>
            </svg>
        </div>

        <span class="status" id="status" role="status" aria-live="polite">
            <span class="titik"></span><span id="status-teks">Offline</span>
        </span>

        <h1>Tidak Ada Koneksi</h1>
        <p class="pesan">Halaman ini butuh internet. Periksa koneksi Anda, lalu coba lagi.</p>

        <ul class="tips">
            <li>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
                Pastikan Wi-Fi atau data seluler menyala.
            </li>
            <li>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
                Coba matikan lalu nyalakan lagi mode pesawat.
            </li>
        </ul>

        <button type="button" class="tombol" id="coba">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v5h.6m14.8 2A8 8 0 004.6 9M4.6 9H9m11 11v-5h-.6m0 0a8 8 0 01-15.3-2m15.3 2H15"/></svg>
            <span id="coba-teks">Coba Lagi</span>
        </button>
        <p class="catatan">Halaman akan dimuat ulang otomatis begitu koneksi kembali.</p>
    </main>

    <script>
        (function () {
            var status = document.getElementById('status');
            var statusTeks = document.getElementById('status-teks');
            var tombol = document.getElementById('coba');
            var tombolTeks = document.getElementById('coba-teks');

            function muatUlang() {
                status.className = 'status ok';
                statusTeks.textContent = 'Terhubung kembali';
                tombol.classList.add('memuat');
                tombolTeks.textContent = 'Memuat…';
                location.reload();
            }

            tombol.addEventListener('click', function () {
                // Masih offline: beri tahu, jangan reload yang pasti gagal lagi.
                if (navigator.onLine === false) {
                    status.className = 'status mencoba';
                    statusTeks.textContent = 'Masih offline';
                    setTimeout(function () {
                        status.className = 'status';
                        statusTeks.textContent = 'Offline';
                    }, 1600);
                    return;
                }
                muatUlang();
            });

            // Kembali online → muat ulang sendiri, pengguna tidak perlu menekan apa pun.
            window.addEventListener('online', muatUlang);
        })();
    </script>
</body>
</html>
