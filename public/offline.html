<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tidak Ada Koneksi</title>
    <style>
        body {
            margin: 0; min-height: 100vh; display: grid; place-items: center;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            background: #faf9f5; color: #3e3d3a; padding: 24px; text-align: center;
        }
        .kotak { max-width: 320px; }
        .ikon {
            width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 16px;
            display: grid; place-items: center; background: #f5f4ef;
        }
        h1 { font-size: 18px; margin: 0 0 8px; }
        p { font-size: 14px; color: #78716c; line-height: 1.6; margin: 0 0 20px; }
        button {
            padding: 12px 24px; border: 0; border-radius: 12px; cursor: pointer;
            background: #d97757; color: #fff; font-size: 14px; font-weight: 600;
        }
        @media (prefers-color-scheme: dark) {
            body { background: #262624; color: #faf9f5; }
            .ikon { background: #30302e; }
            p { color: #a8a29e; }
        }
    </style>
</head>
<body>
    <div class="kotak">
        <div class="ikon">
            <svg width="28" height="28" fill="none" stroke="#d97757" stroke-width="1.7" viewBox="0 0 24 24">
                <path stroke-linecap="round" d="M18.364 5.636a9 9 0 010 12.728M5.636 18.364a9 9 0 010-12.728M3 3l18 18"/>
            </svg>
        </div>
        <h1>Tidak Ada Koneksi</h1>
        <p>Halaman ini butuh internet. Periksa koneksi Anda, lalu coba lagi.</p>
        <button onclick="location.reload()">Coba Lagi</button>
    </div>
</body>
</html>
